# Workflow executing VTA simulator and perform basic tests
#

name: Standalone VTA CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  functional-simulator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Scala
        uses: coursier/cache-action@v8
      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mill
            out
          key: mill-${{ runner.os }}-${{ hashFiles('**/*.mill', 'vta/**/*.scala', 'config/*.json') }}
          restore-keys: |
            mill-${{ runner.os }}-
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          locked: true
          activate-environment: true
      - name: Test VTA compiler and functional simulator
        run: ./mill 'examples.onnx[lenet5,vta_config].fsim'

  chisel-unittests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Scala
        uses: coursier/cache-action@v8
      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mill
            out
          key: mill-${{ runner.os }}-${{ hashFiles('**/*.mill', 'vta/**/*.scala', 'config/*.json') }}
          restore-keys: |
            mill-${{ runner.os }}-
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          locked: true
          activate-environment: true
      - name: Run Chisel unit tests
        run: ./mill vta.hardware.test.unittest

  fpga-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Scala
        uses: coursier/cache-action@v8
      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mill
            out
          key: mill-${{ runner.os }}-${{ hashFiles('**/*.mill', 'vta/**/*.scala', 'config/*.json') }}
          restore-keys: |
            mill-${{ runner.os }}-
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          locked: true
          activate-environment: true
      - name: Run FPGA host tests
        run: ./mill modules.fpga.software.test
      - name: Run FPGA synth tests
        run: ./mill modules.fpga.synthesis.test

  cycle-accurate-simulator-test:
    needs: [functional-simulator-test, chisel-unittests]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Cache Scala
        uses: coursier/cache-action@v8
      - name: Cache Mill
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/mill
            out
          key: mill-${{ runner.os }}-${{ hashFiles('**/*.mill', 'vta/**/*.scala', 'config/*.json') }}
          restore-keys: |
            mill-${{ runner.os }}-
      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.0
        with:
          pixi-version: v0.73.0
          cache: true
          locked: true
          activate-environment: true
      - name: Simulate the inference and check against reference
        run: ./mill -i -Dvta.verilator.threads=2 'examples.onnx[lenet5,vta_config].vsim'
      - name: Cross-check the raw VTA IR fixtures (fsim vs vsim)
        run: ./mill -i -Dvta.verilator.threads=2 'examples.ir[_,vta_config].check'
