# Workflow executing VTA simulator and perform basic tests

name: Standalone VTA Update CI

on:
  workflow_dispatch:


permissions:
  contents: read

jobs:
  functional-simutator-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate: false
          environment-file: environment_setup/standalone-vta.yml
          activate-environment: standalone-vta
          channels: conda-forge,defaults
          channel-priority: flexible
      - name: Tests VTA compiler and functional simulator
        run: cd examples && make compile_and_run

  cycle-accurate-simulator-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cache Scala
        uses: coursier/cache-action@v6
      - name: Setup Scala
        uses: coursier/setup-action@v1
        with:
          jvm: temurin:8
          apps: sbt
      - name: Setup Z3
        id: z3
        uses: cda-tum/setup-z3@v1
      - name: Install Verilator
        run: |
          sudo apt-get install verilator
          verilator --version
      - name: SBT tests
        run: |
          cd src/simulators/cycle_accurate_simulator
          sbt test
      - name: mill tests
        run: |
          cd src/simulators/cycle_accurate_simulator
          ./mill test
