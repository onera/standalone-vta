# Default values of the -Dvta.* build options.
#
# Override one for a single run with ./mill -Dvta.<name>=<value> ..., or pin it
# with ./mill configure vta.<name>=<value> (written to .mill-jvm-opts).
#
# This is data on purpose, not a Map in build.mill: Mill invalidates a task
# when the bytecode of any build method it calls changes, and every task that
# reads an option goes through build.getVtaArg. With the defaults in code,
# adding an option changed that bytecode and invalidated synthesis and the
# Vitis flow. From a file, adding or changing a default is a value change,
# which only re-runs the tasks that actually read that option.
#
# Every option must have a line here: build.getVtaArg rejects unknown names.

# Default config filename.
vta.config.file=vta_config.json
# Default DDR offset for FPGA DRAM allocation.
vta.ddr.base=0x0
# Default FPGA board used by the synthesis flows.
vta.board.name=zcu104
# FatFs volume the SD data loader reads from ("0:/" or "1:/").
vta.sd.drive=0:/
# SD-card subfolder of the model's files; empty for the model name.
vta.sd.dir=
# Heap size written into a generated app's linker script.
vta.heap.size=0x800000
# Compiler optimization level of the generated app: O0 (Vitis default), O1,
# O2, O3 or Os. Above O0, -ffp-contract=off is added so the CPU steps stay
# bit-identical to fsim. O2 runs the CPU steps ~4x faster than O0.
vta.app.opt=O0
# PS UART baud rate, used by both the app (VTA_UART_BAUD) and uart_nn.py.
vta.uart.baud=115200
# Lower convolutions directly onto the GEMM loop nest instead of a GEMM over a
# CPU-built im2row matrix.
vta.direct.conv=false
# Largest direct/im2row GEMM-work ratio to accept when the above is on.
vta.direct.conv.max.work=1.0
# Fold each layer's input zero point into its bias (raw INP activations).
vta.fold.inp.zp=false
# Default verilator threads for verilator simulation.
vta.verilator.threads=4
# Default jobs for vivado synthesis.
vta.vivado.jobs=4
# Default ONNX file for the run flow (relative to the repository root).
vta.onnx.file=examples/onnx/lenet5.onnx
