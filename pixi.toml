[workspace]
name = "standalone-vta"
version = "0.2.0"
description = "Complete environment for training, ONNX export and Chisel/Verilator simulation and FPGA implementation of the STANDALONE-VTA"
authors = ["Julien Posso <jposso@onera.fr>"]
# Add conda-forge first to resolve system library channels, followed by PyTorch and NVIDIA
channels = ["conda-forge", "pytorch", "nvidia"]
platforms = ["linux-64"]

[activation.env]
MILL_VERSION = "1.1.7-jvm"

[dependencies]
# --- Base Languages and Runtimes ---
python = "3.12.*"
openjdk = "17.*"
verilator = "==5.046"

# --- System Tools and Hardware Compilation Toolchain ---
# C/C++ toolchain for the functional simulator and the verilated model. Verilator
# already pulls a compiler in transitively and compiles its archive with it; declaring
# it here pins that same toolchain for our own objects too, so a single compiler builds
# the whole binary and the build no longer depends on whatever g++ the host happens to
# ship. The activation sets CC/CXX, which the functional_simulator Makefile honours.
cxx-compiler = "*"
make = "*"
gawk = "*"         # Ensure we have GNU Awk for Vivado and scripts
curl = "*"         # Required by Mill to download its jars
flex = "*"
bison = "*"
ccache = "*"
zlib = "*"


# --- Mathematical & Communication Libraries ---
matplotlib = "*"
tqdm = ">=4.67.3,<5"
pyserial = ">=3.5"
mpmath = "==1.3.0"   # Pin to 1.3.0 to satisfy executorch requirement on PyPI


[pypi-dependencies]
# ONNX tools, quantization and compilation
onnxruntime = "==1.20.1"
onnx = "==1.18.0"

[feature.training]

[feature.training.dependencies]
# PyTorch ecosystem with GPU support (CUDA 12.1)
# Pixi directly downloads heavy NVIDIA dependencies in an isolated manner
cuda-nvcc = "12.1.*"
pytorch = "2.11.*"
torchvision = "0.26.*"

[feature.training.pypi-dependencies]
onnx-graphsurgeon = "==0.3.27"
onnxscript = "==0.6.2"
executorch = "==1.2.0"
torchao = "==0.17.*"

# NVIDIA index is only needed to resolve the training PyPI packages.
[feature.training.pypi-options]
extra-index-urls = ["https://pypi.ngc.nvidia.com"]

[environments]
# `pixi run -e training <cmd>` when training / quantizing neural networks.
training = ["training"]
